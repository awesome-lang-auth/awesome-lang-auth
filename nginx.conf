# Serving config for the built Docusaurus site (Dockerfile stage 2).
#
# Replaces the nginx:alpine default, which had two SEO-visible defects:
#   - /docs/ returned 403 (directory with no index.html, autoindex off)
#   - 404s were served with nginx's own error page instead of Docusaurus' 404.html
#
# The site is built with trailingSlash: true, so every route is a directory
# containing index.html — nginx's default index/redirect handling is correct for
# everything except the /docs/ root, which has no doc of its own.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Behind Traefik/openresty: keep nginx's automatic directory redirects
    # relative so they never leak the container host or port 80.
    absolute_redirect off;
    port_in_redirect  off;

    # ── /docs root ─────────────────────────────────────────────────────────────
    # There is no doc at /docs, so the directory has no index.html. Send it to
    # the entry page instead of 403-ing. Both forms redirect in a single hop.
    location = /docs  { return 301 /docs/intro/; }
    location = /docs/ { return 301 /docs/intro/; }

    # ── Static assets ──────────────────────────────────────────────────────────
    # Docusaurus fingerprints filenames in /assets, so they are safe to pin.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ── HTML ───────────────────────────────────────────────────────────────────
    # Short TTL with revalidation: a redeploy must be visible to crawlers and
    # users immediately, otherwise fresh content keeps serving stale (the exact
    # failure this site already hit).
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # robots.txt and sitemap.xml must always be fresh for crawlers.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Errors ─────────────────────────────────────────────────────────────────
    # Serve Docusaurus' own 404 page while keeping the 404 status code, so Google
    # treats missing URLs as gone rather than as soft 404s.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Compression ────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml;
}
