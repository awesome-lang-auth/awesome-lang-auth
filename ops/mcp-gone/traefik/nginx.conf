# mcp.awesomenodeauth.com → 410 Gone, served behind Traefik (see ../README.md).
#
# Traefik routes only Host(`mcp.awesomenodeauth.com`) here and terminates TLS,
# so this server answers every request on port 80. The location block is the
# text pasted into Nginx Proxy Manager (../nginx-proxy-manager.md → "Text to
# paste"), indented by four spaces: keep the two identical.

server {
    listen      80;
    server_name _;
    server_tokens off;

    location / {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400" always;
        return 410 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MCP server retired</title></head><body><h1>MCP server retired</h1><p>The hosted awesome-node-auth MCP server has been permanently shut down: the library is unaffected and its documentation is at <a href="https://www.awesomenodeauth.com/docs/intro/">www.awesomenodeauth.com/docs/intro/</a>.</p></body></html>\n';
    }
}
