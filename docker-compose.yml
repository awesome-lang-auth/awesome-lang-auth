services:
  docusaurus-wiki:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Passiamo i segreti durante la build perché Docusaurus 
        # li inietta nel bundle JS statico
        - AI_LLM_ENDPOINT=${AI_LLM_ENDPOINT}
        - AI_MODEL=${AI_MODEL}
        - AI_TEMPERATURE=${AI_TEMPERATURE}
        - AI_MAX_TOKENS=${AI_MAX_TOKENS}
        - ACCOUNT_API_URL=${ACCOUNT_API_URL}
    container_name: docusaurus_docs
    restart: always
    networks:
      - awesome-node-auth # Assicurati che sia la stessa rete di Traefik
    ports:
      - "${PORT:-3000}:80" # Mappa la porta 80 del container alla porta 3000 del host
    labels:
      - "traefik.enable=true"
      # Sostituisci con il tuo dominio reale per la Wiki
      - "traefik.http.routers.docusaurus.rule=Host(`www.awesomenodeauth.com`)"
      - "traefik.http.routers.docusaurus.entrypoints=websecure"
      - "traefik.http.routers.docusaurus.tls.certresolver=myresolver" # Il nome del tuo resolver in traefik.yml
      - "traefik.http.services.docusaurus.loadbalancer.server.port=80"

networks:
  awesome-node-auth:
    driver: bridge